name: Dependency security checks
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '49 0 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level=low
      - name: Build the Worker
        run: pnpm build
        env:
          NITRO_PRESET: cloudflare-module
      - name: Check the rendered home page
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4.164.0 dev .output/server/index.mjs --assets .output/public --compatibility-date 2025-09-28 --compatibility-flags nodejs_compat --local --port 8787 > /tmp/archive-worker.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/archive-worker.log; kill "$worker_pid" || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8787/ -o /dev/null
